[project]
name = "parangsae-unified-quant"
version = "0.1.0"
description = "Personal Binance-only quant app, live-ready but default-disabled."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
quantctl = "apps.cli.quantctl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
