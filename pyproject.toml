[project]
name = "parangsae-unified-quant"
version = "0.1.0"
description = "Personal Binance-only quant app for paper/dry-run research with gated live execution disabled by default."
requires-python = ">=3.12"
dependencies = [
    "backtesting>=0.6.5",
    "ccxt>=4.4.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
quantctl = "apps.cli.quantctl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]
