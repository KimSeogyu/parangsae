name: ci
on: push
permissions:
  contents: read
env:
  CARGO_WORKSPACE_DIR: /tmp/other
jobs:
  fmt:
    env:
      GITHUB_ACTIONS: "0"
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          CI: "false"
        run: echo fmt
      - name: base
        env:
          PARANGSAE_FLOOR_BASE: abc
        run: echo base
