name: ci
on:
  push:
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          env -i HOME=/tmp PATH=/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup /usr/bin/curl --fail --location --silent --show-error --output "$tarball" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
