SPECIFICATION Spec

CONSTANTS
    Intents = {i1}
    MaxRequestQty = 3
    MaxOrderQty = 2
    PositionLimit = 2
    NotionalLimit = 3
    Prices = {1, 2}
    MaxDailyLoss = 1
    MaxObservedLoss = 1

INVARIANTS
    TypeOK
    ApprovedQuantityBound
    PositionBound
    NotionalBound
    DailyLossTripsHalt
    EpochTracksLatches
    EveryFillSubsetWithinLimits
    ReduceOnlyRemainsApprovable
    ApprovalsRespectLimits
    OnlyGateIssuesApprovedOrder
    OnlyApprovedOrderSubmits
    DispatchRespectsCurrentGate
    NoIncreaseAfterKill
    SingleUse

PROPERTIES
    DailyHaltMonotonic
    KillMonotonic
    EpochMonotonic
    IntentImmutable
    QueuedCheckTerminates
    HeldTokenTerminates
    KillEventuallyDrains

\* Keep deadlock checking enabled. Distinct loss observations always remain
\* possible, including recovery after a trip; no state constraint cuts traces.
\* Regression: qty +/-3 reaches admission with a limit of 2; position and
\* notional caps are independent at price 2. All invariants/properties retained.
