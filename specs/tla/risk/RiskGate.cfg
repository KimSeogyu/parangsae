SPECIFICATION Spec

CONSTANTS
    Intents = {i1, i2}
    MaxRequestQty = 2
    MaxOrderQty = 1
    PositionLimit = 1
    NotionalLimit = 1
    Prices = {1}
    MaxDailyLoss = 1
    MaxObservedLoss = 1

INVARIANTS
    TypeOK
    ApprovedQuantityBound
    PositionBound
    NotionalBound
    DailyLossTripsHalt
    EpochTracksLatches
    EveryFillSubsetWithinLimits
    ReduceOnlyRemainsApprovable
    ApprovalsRespectLimits
    OnlyGateIssuesApprovedOrder
    OnlyApprovedOrderSubmits
    DispatchRespectsCurrentGate
    NoIncreaseAfterKill
    SingleUse

PROPERTIES
    DailyHaltMonotonic
    KillMonotonic
    EpochMonotonic
    IntentImmutable
    QueuedCheckTerminates
    HeldTokenTerminates
    KillEventuallyDrains

\* Keep deadlock checking enabled. Distinct loss observations always remain
\* possible, including recovery after a trip; no state constraint cuts traces.
\* Two ids retain concurrent reservation coverage. Requests include +/-2,
\* above the order limit of 1. Loss levels 0/1 exercise trip and recovery.
\* Price is fixed at 1 here, so position and notional caps coincide. The
\* supplemental quantity regression config uses distinct caps and qty 3.
