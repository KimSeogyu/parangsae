[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Architecture policy generator and enforcement. No order route."

[lints.clippy]
float_arithmetic = "deny"

[dependencies]
cargo_metadata = "0.19"
clap = { version = "4.6.7", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "2", features = ["clone-impls", "extra-traits", "full", "visit"] }
