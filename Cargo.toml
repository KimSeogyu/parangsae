[workspace]
resolver = "2"
exclude = [
    "spec/sgd/generated/c1-control/rust",
    "spec/sgd/generated/c1-report-custody/rust",
    "spec/sgd/generated/c1-report-domain/rust",
]
members = [
    "crates/core",
    "crates/collector",
    "crates/signals",
    "crates/strategies",
    "crates/regime",
    "crates/execution",
    "crates/risk",
    "crates/sim",
    "crates/backtest",
    "xtask",
    "spec/sgd/generated/fact-write/rust",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.88"

# Checked arithmetic stays checked in release builds. A wrapping notional is a bug.
[profile.release]
overflow-checks = true
