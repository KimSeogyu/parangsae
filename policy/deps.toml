# Allowed dependency edges.
#
# `cargo xtask depgraph` reads `cargo metadata --locked --format-version 1` and
# rejects an edge that is not listed here: normal, dev, and build; renamed
# dependencies (the package name is what is checked); path and git replacements;
# a feature that is not in `features`; default features turned on when this
# file says false; a strategy `build.rs` or proc-macro.
#
# A crate listed here that is not in the workspace yet is planned. Its edges
# are checked the day the package appears. A workspace package missing from
# this file fails.
#
# Parquet and arrow are on parangsae-collector today because parangsae-store
# does not exist yet. The store edges below are the destination.

[[strategy]]
path_prefix = "crates/strategies/"
internal = ["parangsae-core", "parangsae-strategy-api", "parangsae-signals", "parangsae-regime"]
forbid_build_script = true
forbid_proc_macro = true

[[crate]]
name = "parangsae-core"

[[crate.edge]]
name = "cucumber"
kind = "dev"
source = "crates.io"
default_features = true

[[crate.edge]]
name = "proptest"
kind = "dev"
source = "crates.io"
default_features = true

[[crate.edge]]
name = "tokio"
kind = "dev"
source = "crates.io"
default_features = true
features = ["macros", "rt-multi-thread"]

