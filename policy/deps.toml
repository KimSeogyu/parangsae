# Allowed dependency edges.
#
# `cargo xtask depgraph` reads `cargo metadata --locked --format-version 1` and
# rejects an edge that is not listed here: normal, dev, and build; renamed
# dependencies (the package name is what is checked); path and git replacements;
# a feature that is not in `features`; default features turned on when this
# file says false; a strategy `build.rs` or proc-macro.
#
# `[[crate]]` is checked against workspace members. A name here that is not a
# member fails. `[[planned]]` is not checked. A planned name that is also a
# member fails until the entry moves to `[[crate]]`. Every allowed edge is
# listed; a path-prefix allow is not an edge.
#
# signals, regime, strategy crates, and research may not resolve reqwest,
# hyper, or tokio-tungstenite through a normal dependency.
#
# Parquet and arrow are on parangsae-collector today because parangsae-store
# does not exist yet. The store edges below are the destination. Research
# reads through the store reader, so it does not depend on collector,
# execution, or git2.

[[strategy]]
path_prefix = "crates/strategies/"
internal = ["parangsae-core", "parangsae-strategy-api", "parangsae-signals", "parangsae-regime"]
forbid_build_script = true
forbid_proc_macro = true

[[crate]]
name = "parangsae-core"

[[crate.edge]]
name = "cucumber"
kind = "dev"
source = "crates.io"
default_features = true

[[crate.edge]]
name = "proptest"
kind = "dev"
source = "crates.io"
default_features = true

[[crate.edge]]
name = "serde_json"
kind = "dev"
source = "crates.io"
default_features = true

[[crate.edge]]
name = "tokio"
kind = "dev"
source = "crates.io"
default_features = true
features = ["macros", "rt-multi-thread"]

[[crate.edge]]
name = "toml"
kind = "dev"
source = "crates.io"
default_features = true

[[crate]]
name = "parangsae-sim"

[[crate.edge]]
name = "parangsae-core"
kind = "normal"
source = "path"
default_features = true
features = ["driver-clock"]

