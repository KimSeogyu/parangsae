[package]
name = "parangsae-execution"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Offline order lifecycle and demo protocol codec. No order transport."

[lints.clippy]
float_arithmetic = "deny"

[dependencies]
parangsae-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
proptest = "1.6"
cucumber = "=0.22.1"
futures = "0.3"
