[package]
name = "parangsae-strategies"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "First-batch strategy families. Closed bars only, through Causal."

[dependencies]
parangsae-core = { path = "../core" }
parangsae-signals = { path = "../signals" }
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }

[dev-dependencies]
proptest = "1.6"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
float_cmp = "deny"
cast_possible_truncation = "deny"
unwrap_used = "deny"
