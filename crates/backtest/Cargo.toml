[package]
name = "parangsae-backtest"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Event-driven BTCUSDT backtest. Reads a parquet tape. No order route."

[dependencies]
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
parangsae-core = { path = "../core" }
parangsae-execution = { path = "../execution" }
parangsae-signals = { path = "../signals" }
parangsae-sim = { path = "../sim" }
parangsae-strategies = { path = "../strategies" }
sgd-owned-c1opportunitycontrol-50dd0338899d = { path = "../../spec/sgd/generated/c1-control/rust" }
c1_report_custody = { package = "sgd-owned-reportcustody-0089cad30e97", path = "../../spec/sgd/generated/c1-report-custody/rust" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
parangsae-risk = { path = "../risk" }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
cucumber = "=0.22.1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
proptest = "1.6"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

