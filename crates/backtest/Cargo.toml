[package]
name = "parangsae-backtest"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Event-driven BTCUSDT backtest. Reads a parquet tape. No order route."

[dependencies]
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
parangsae-core = { path = "../core" }
parangsae-sim = { path = "../sim" }

[dev-dependencies]
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
cucumber = "=0.22.1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
proptest = "1.6"
tempfile = "3.27.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "backtest_engine"
harness = false
