[package]
name = "parangsae-collector"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Binance Vision backfill. Public archives only; no API key and no order route."

[dependencies]
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
parangsae-core = { path = "../core" }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
url = "2.5.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
cucumber = "=0.22.1"
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "vision_integrity"
harness = false
