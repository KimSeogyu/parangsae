[package]
name = "parangsae-signals"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Causal signals. Views come from Observation::causal_at."

[lints]
workspace = true

[dependencies]
parangsae-core = { path = "../core", version = "0.0.0" }
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }

[dev-dependencies]
parangsae-core = { path = "../core", version = "0.0.0" }
parangsae-sim = { path = "../sim", version = "0.0.0" }
cucumber = "=0.22.1"
proptest = "1.6"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "signals_v0"
harness = false
