name: vision-smoke

# Optional. Not part of the required push checks. Downloads one public Vision day.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      day:
        description: UTC day (YYYY-MM-DD)
        default: "2026-09-01"
        required: true

jobs:
  smoke:
    name: one UM kline day
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: download and ingest one day
        env:
          VISION_DAY: ${{ inputs.day }}
        run: |
          case "$VISION_DAY" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "day must be YYYY-MM-DD"
              exit 1
              ;;
          esac
          cargo run -p parangsae-collector --release -- vision --dataset um-kline --from "$VISION_DAY" --to "$VISION_DAY" --data-dir /tmp/vision-smoke
