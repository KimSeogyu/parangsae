name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      kani: ${{ steps.filter.outputs.kani }}
      tla: ${{ steps.filter.outputs.tla }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide which path-gated jobs run
        id: filter
        # Fail-safe: when no base can be determined, both kani and tla run.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          base=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] \
              && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$PUSH_BEFORE" "$head"; then
            base="$PUSH_BEFORE"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$DEFAULT_BRANCH" ]; then
            # New branch (before is all zeros) or force push: diff against the default branch.
            base=$(git merge-base "origin/$DEFAULT_BRANCH" "$head" 2>/dev/null || true)
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable diff base; running kani and tla."
            echo "kani=true" >> "$GITHUB_OUTPUT"
            echo "tla=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Diff base: $base  head: $head"
          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          # Crates whose src/ holds a Kani harness (at base or head).
          kani_crates=$( { git grep -l -E 'kani::proof' "$head" -- 'crates/*/src/**' || true
                           git grep -l -E 'kani::proof' "$base" -- 'crates/*/src/**' || true; } \
                         | sed -E 's#^[0-9a-f]+:crates/([^/]+)/.*#\1#' | sort -u)
          echo "Crates with Kani harnesses: ${kani_crates:-none}"
          kani_re='cfg\((any\()?[^)]*kani|cfg_attr\(kani|kani::'
          mentions_kani() {
            { git show "$head:$1" 2>/dev/null || true; git show "$base:$1" 2>/dev/null || true; } \
              | grep -qE "$kani_re"
          }
          kani=false
          tla=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/workflows/*) kani=true; tla=true ;;
            esac
            case "$f" in
              specs/tla/*) tla=true ;;
            esac
            case "$f" in
              crates/*/src/*)
                c=$(printf '%s\n' "$f" | cut -d/ -f2)
                if printf '%s\n' $kani_crates | grep -qx "$c"; then kani=true; fi ;;
            esac
            case "$f" in
              Cargo.toml|rust-toolchain|rust-toolchain.toml|*kani*) kani=true ;;
              crates/*/Cargo.toml) if mentions_kani "$f" || git show "$head:$f" 2>/dev/null | grep -q kani; then kani=true; fi ;;
            esac
            case "$f" in
              *.rs) if mentions_kani "$f"; then kani=true; fi ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "kani=$kani tla=$tla"
          echo "kani=$kani" >> "$GITHUB_OUTPUT"
          echo "tla=$tla" >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (unit, proptest, cucumber, execution lock)
        run: cargo test --workspace

  cucumber:
    name: cucumber
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: kline integrity features
        run: cargo test -p parangsae-core --test kline_integrity
      - name: vision integrity features
        run: cargo test -p parangsae-collector --test vision_integrity

  tla:
    name: tla
    needs: changes
    if: needs.changes.outputs.tla == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC 2.19 (TLA+ 1.7.4)
        working-directory: specs/tla
        run: |
          curl -fsSL -o tla2tools.jar -L \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      - name: Model-check IngestSegment
        working-directory: specs/tla
        # One worker: TLC 2.19 can miss a liveness counterexample with several workers.
        # A violated invariant or property makes TLC exit non-zero.
        run: |
          java -XX:+UseParallelGC -Xmx512m -cp tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-ingest" \
            -config IngestSegment.cfg \
            IngestSegment.tla
      - name: Model-check ManifestWrite
        working-directory: specs/tla
        run: |
          java -XX:+UseParallelGC -Xmx512m -cp tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-manifest" \
            -config ManifestWrite.cfg \
            ManifestWrite.tla

      - name: Model-check execution OrderLifecycle
        working-directory: specs/tla/execution
        run: |
          java -XX:+UseParallelGC -Xmx2g -cp ../tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-order-lifecycle" \
            -config OrderLifecycle.cfg \
            OrderLifecycle.tla

  kani:
    name: kani
    needs: changes
    if: needs.changes.outputs.kani == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The marketplace action at v1.1 has a broken version check (`if [$?`).
      # Install the pinned verifier directly so a failed proof fails this job.
      - name: Install Kani 0.68.0
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Prove notional arithmetic
        run: cargo kani -p parangsae-core

  spec-arch:
    name: spec-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch TLC 2.19 (TLA+ 1.7.4)
        working-directory: specs/tla
        run: |
          curl -fsSL -o tla2tools.jar -L \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      - name: validate, generate --check, enforce
        run: |
          cargo xtask spec validate --jar specs/tla/tla2tools.jar
          cargo xtask spec generate --check
          # PATH has no bot identity in CI. Fail a changed path that has no
          # single owner. --no-renames checks both sides of a move. --as still
          # attributes a diff to a bot when a person runs it locally.
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          base=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")
          cargo xtask spec enforce --diff "${base}..HEAD"

  gate:
    name: gate
    if: always()
    needs: [changes, fmt, clippy, test, cucumber, tla, kani, spec-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled (skipped counts as passing)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
