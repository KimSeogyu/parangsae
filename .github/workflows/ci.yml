name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  lint-fixture:
    name: lint fixture fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: format the fixtures
        run: |
          cargo fmt --manifest-path fixtures/lint/violation/Cargo.toml -- --check
          cargo fmt --manifest-path fixtures/lint/unsafe-forbid/Cargo.toml -- --check
      - name: workspace clippy lints reject the violation fixture
        run: |
          set +e
          output=$(cargo clippy --manifest-path fixtures/lint/violation/Cargo.toml --all-targets -- -D warnings 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "violation fixture was accepted"
            exit 1
          fi
          for lint in \
            unwrap_used \
            expect_used \
            clippy::panic \
            clippy::todo \
            unimplemented \
            dbg_macro \
            wildcard_enum_match_arm \
            cast_possible_truncation \
            cast_possible_wrap \
            cast_sign_loss \
            float_arithmetic \
            allow_attributes_without_reason \
            print_stdout \
            print_stderr \
            clippy::exit \
            arithmetic_side_effects
          do
            if ! printf '%s\n' "$output" | grep -q "$lint"; then
              echo "lint fixture did not report $lint"
              exit 1
            fi
          done
      - name: unsafe_code forbid rejects the unsafe fixture
        run: |
          set +e
          output=$(cargo check --manifest-path fixtures/lint/unsafe-forbid/Cargo.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unsafe fixture was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unsafe-code'

  depgraph:
    name: depgraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask depgraph
        run: cargo xtask depgraph

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (unit, proptest, cucumber, execution lock)
        run: cargo test --workspace
      - name: test-support constructors
        run: cargo test -p parangsae-core --features test-support --lib
      - name: causal gate compile-fail
        # Own workspace: the main workspace test unifies parangsae-sim's driver-clock.
        # trybuild is not in the workspace lock, so this step cannot use --offline.
        run: cargo test --manifest-path fixtures/causal/closed-gate/Cargo.toml --locked

  cucumber:
    name: cucumber
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: kline integrity features
        run: cargo test -p parangsae-core --test kline_integrity
      - name: vision integrity features
        run: cargo test -p parangsae-collector --test vision_integrity
      - name: instrument rules features
        run: cargo test -p parangsae-core --test instrument_rules
      - name: malformed feature and undefined step fail
        run: cargo test -p parangsae-core --test feature_reject

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask guards
        env:
          PARANGSAE_FLOOR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PARANGSAE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          if printf '%s' "$PARANGSAE_FLOOR_BASE" | grep -Eq '^0{40}$'; then
            git fetch --depth=1 origin main
          elif [ -n "$PARANGSAE_FLOOR_BASE" ]; then
            git fetch --depth=1 origin "$PARANGSAE_FLOOR_BASE"
          fi
          cargo xtask guards
      - name: unowned feature fails
        run: |
          set +e
          output=$(cargo xtask guards features --root fixtures/guards/unowned 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unowned feature was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unowned feature'
      - name: cfg missing an invariant fails
        run: |
          set +e
          output=$(cargo xtask guards tlc-cfg \
            --tla specs/tla/IngestSegment.tla \
            --cfg fixtures/guards/tlc/IngestSegment-missing-invariant.cfg 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "deleted invariant was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'Contiguous'
      - name: invariant deleted from the model and the cfg fails
        run: |
          set +e
          output=$(cargo xtask guards tlc-cfg \
            --tla fixtures/guards/tlc/deleted-both.tla \
            --cfg fixtures/guards/tlc/deleted-both.cfg \
            --model IngestSegment 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "invariant deleted from both files was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'Contiguous'
      - name: unreadable floor baseline fails closed
        run: |
          set +e
          output=$(PARANGSAE_FLOOR_BASE=not-a-sha cargo xtask guards 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unreadable baseline was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unreadable'
      - name: all-zero before compares with merge-base and does not skip
        run: |
          git fetch --depth=1 origin main
          set +e
          output=$(PARANGSAE_FLOOR_BASE=0000000000000000000000000000000000000000 cargo xtask guards 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'unreadable'; then
            echo "all-zero before was treated as unreadable"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" | grep -q 'baseline floors.toml is missing'
          fi
      - name: direct push without a floors file fails closed
        run: |
          set +e
          output=$(PARANGSAE_ON_MAIN=1 PARANGSAE_FLOOR_BASE=a84508c798fa3e2f08f71d4be988da43ef1c5472 cargo xtask guards 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "direct push without floors was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'direct push'
      - name: lowered floor fails the ratchet
        run: |
          set +e
          output=$(cargo xtask guards ratchet \
            --current fixtures/guards/floors-lowered.toml \
            --base regressions/floors.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "lowered floor was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'decreased'
      - name: kani failure summary is rejected
        run: |
          set +e
          output=$(cargo xtask guards kani-output --file fixtures/guards/kani-one-failure.txt 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "kani failure summary was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'failures'
      - name: append while gap breaks NoAppendWhileGap
        run: |
          set +e
          output=$(cargo run -q -p parangsae-collector --bin segment-invariants -- fixtures/guards/segment/append_while_gap.txt 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "append while gap was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'NoAppendWhileGap'
      - name: a job omitted from gate.needs fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/omitted-job.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "omitted gate job was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci job clippy is missing from gate.needs'

  tla:
    name: tla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC 2.19 (TLA+ 1.7.4)
        working-directory: specs/tla
        run: |
          curl -fsSL -o tla2tools.jar -L \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      - name: Model-check IngestSegment
        working-directory: specs/tla
        # One worker: TLC 2.19 can miss a liveness counterexample with several workers.
        # A violated invariant or property makes TLC exit non-zero.
        run: |
          set -o pipefail
          java -XX:+UseParallelGC -Xmx512m -cp tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-ingest" \
            -config IngestSegment.cfg \
            IngestSegment.tla | tee "${{ runner.temp }}/tlc-ingest.txt"
          cargo xtask guards tlc-output --model IngestSegment --file "${{ runner.temp }}/tlc-ingest.txt"
      - name: Model-check ManifestWrite
        working-directory: specs/tla
        run: |
          set -o pipefail
          java -XX:+UseParallelGC -Xmx512m -cp tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-manifest" \
            -config ManifestWrite.cfg \
            ManifestWrite.tla | tee "${{ runner.temp }}/tlc-manifest.txt"
          cargo xtask guards tlc-output --model ManifestWrite --file "${{ runner.temp }}/tlc-manifest.txt"

  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # The marketplace action at v1.1 has a broken version check (`if [$?`).
      # Install the pinned verifier directly so a failed proof fails this job.
      - name: Install Kani 0.68.0
        env:
          # rust-toolchain.toml pins 1.98.0. The verifier builds with that pin.
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Prove notional arithmetic
        env:
          # cargo kani must use the nightly it installed, not the pinned stable.
          RUSTUP_TOOLCHAIN: nightly-2026-08-21
        run: |
          set -o pipefail
          cargo kani -p parangsae-core 2>&1 | tee "${{ runner.temp }}/kani.txt"
      - name: Check the Kani summary
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask guards kani-output --file "${{ runner.temp }}/kani.txt"
      - name: removing the negative guard fails its proof
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-21
        run: |
          set +e
          output=$(cargo kani --manifest-path fixtures/guards/unguarded-notional/Cargo.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unguarded notional proof passed"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unguarded_notional_accepts_a_negative'

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install cargo-deny 0.20.2
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
      - name: reqwest outside the collector wrapper fails
        run: |
          set +e
          output=$(cargo deny --manifest-path fixtures/deny/banned-reqwest/Cargo.toml --config deny.toml check bans 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "banned reqwest was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'reqwest'

  gate:
    name: gate
    needs: [fmt, clippy, lint-fixture, depgraph, test, cucumber, guards, tla, kani, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = [
              f"{name}={info.get('result')}"
              for name, info in sorted(needs.items())
              if info.get("result") != "success"
          ]
          if not needs:
              sys.exit("gate has no needed jobs")
          if bad:
              sys.exit("gate required success: " + ", ".join(bad))
          PY
