name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: clippy
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  lint-fixture:
    name: lint fixture fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: clippy, rustfmt
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: format the fixtures
        run: |
          cargo fmt --manifest-path fixtures/lint/violation/Cargo.toml -- --check
          cargo fmt --manifest-path fixtures/lint/unsafe-forbid/Cargo.toml -- --check
      - name: workspace clippy lints reject the violation fixture
        run: |
          set +e
          output=$(cargo clippy --manifest-path fixtures/lint/violation/Cargo.toml --all-targets -- -D warnings 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "violation fixture was accepted"
            exit 1
          fi
          for lint in \
            unwrap_used \
            expect_used \
            clippy::panic \
            clippy::todo \
            unimplemented \
            dbg_macro \
            wildcard_enum_match_arm \
            cast_possible_truncation \
            cast_possible_wrap \
            cast_sign_loss \
            float_arithmetic \
            allow_attributes_without_reason \
            print_stdout \
            print_stderr \
            clippy::exit \
            arithmetic_side_effects
          do
            if ! printf '%s\n' "$output" | grep -q "$lint"; then
              echo "lint fixture did not report $lint"
              exit 1
            fi
          done
      - name: unsafe_code forbid rejects the unsafe fixture
        run: |
          set +e
          output=$(cargo check --manifest-path fixtures/lint/unsafe-forbid/Cargo.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unsafe fixture was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unsafe-code'

  depgraph:
    name: depgraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: cargo xtask depgraph
        run: cargo xtask depgraph

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: cargo test (unit, proptest, cucumber, execution lock)
        run: cargo test --workspace
      - name: test-support constructors
        run: cargo test -p parangsae-core --features test-support --lib
      - name: causal gate compile-fail
        # Own workspace: the main workspace test unifies parangsae-sim's driver-clock.
        # trybuild is not in the workspace lock, so this step cannot use --offline.
        run: cargo test --manifest-path fixtures/causal/closed-gate/Cargo.toml --locked

  cucumber:
    name: cucumber
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: kline integrity features
        run: cargo test -p parangsae-core --test kline_integrity
      - name: vision integrity features
        run: cargo test -p parangsae-collector --test vision_integrity
      - name: instrument rules features
        run: cargo test -p parangsae-core --test instrument_rules
      - name: malformed feature and undefined step fail
        run: cargo test -p parangsae-core --test feature_reject

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: cargo xtask guards
        env:
          PARANGSAE_FLOOR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PARANGSAE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          set -o pipefail
          cargo xtask guards | tee "${{ runner.temp }}/guards.txt"
          grep -qx 'guards ran 12 passed 12' "${{ runner.temp }}/guards.txt"
      - name: all-zero before compares with merge-base and does not skip
        run: |
          set -o pipefail
          PARANGSAE_FLOOR_BASE=0000000000000000000000000000000000000000 cargo xtask guards | tee "${{ runner.temp }}/guards-zero.txt"
          grep -qx 'guards ran 12 passed 12' "${{ runner.temp }}/guards-zero.txt"

  guard-fixtures:
    name: guard-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - name: unowned feature fails
        run: |
          set +e
          output=$(cargo xtask guards features --root fixtures/guards/unowned 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unowned feature was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unowned feature'
      - name: cfg missing an invariant fails
        run: |
          set +e
          output=$(cargo xtask guards tlc-cfg \
            --tla specs/tla/IngestSegment.tla \
            --cfg fixtures/guards/tlc/IngestSegment-missing-invariant.cfg 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "deleted invariant was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'Contiguous'
      - name: invariant deleted from the model and the cfg fails
        run: |
          set +e
          output=$(cargo xtask guards tlc-cfg \
            --tla fixtures/guards/tlc/deleted-both.tla \
            --cfg fixtures/guards/tlc/deleted-both.cfg \
            --model IngestSegment 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "invariant deleted from both files was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'Contiguous'
      - name: unreadable floor baseline fails closed
        env:
          PARANGSAE_FLOOR_BASE: not-a-sha
        run: |
          set +e
          output=$(cargo xtask guards 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unreadable baseline was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unreadable'
      - name: direct push without a floors file fails closed
        run: cargo xtask run-exact guards::tests::missing_or_unreadable_baseline_fails_closed
      - name: lowered floor fails the ratchet
        run: |
          set +e
          output=$(cargo xtask guards ratchet \
            --current fixtures/guards/floors-lowered.toml \
            --base regressions/floors.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "lowered floor was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'decreased'
      - name: kani failure summary is rejected
        run: |
          set +e
          output=$(cargo xtask guards kani-output --file fixtures/guards/kani-one-failure.txt 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "kani failure summary was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'failures'
      - name: append while gap breaks NoAppendWhileGap
        run: |
          set +e
          output=$(cargo run -q -p parangsae-collector --bin segment-invariants -- fixtures/guards/segment/append_while_gap.txt 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "append while gap was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'NoAppendWhileGap'
      - name: a job omitted from gate.needs fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/omitted-job.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "omitted gate job was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci job clippy is missing from gate.needs'
      - name: gate without if always fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/no-always.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "gate without if always was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'gate job is missing if: always()'
      - name: exit 0 gate check fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/exit-zero.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "exit 0 gate check was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'gate check step does not match'
      - name: replaced gate script fails the sha256 pin
        run: |
          set +e
          output=$(cargo xtask guards gate-script --file fixtures/guards/ci/gate_results_exit_zero.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "replaced gate script was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'gate_results.py sha256 does not match'
      - name: weakened gate fixture step fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/fixture-step-weakened.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "weakened gate fixture step was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'gate fixture step does not match'
      - name: weakened gate fixture file fails the sha256 pin
        run: |
          set +e
          output=$(cargo xtask guards gate-fixture --name fixtures/guards/ci/needs-success.json --file fixtures/guards/ci/needs-success-weakened.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "weakened gate fixture file was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'needs-success.json sha256 does not match'
      - name: bom or crlf gate fixture fails the sha256 pin
        run: |
          set +e
          bom=$(cargo xtask guards gate-fixture --name fixtures/guards/ci/needs-success.json --file fixtures/guards/ci/needs-success-bom.json 2>&1)
          bom_status=$?
          crlf=$(cargo xtask guards gate-fixture --name fixtures/guards/ci/needs-success.json --file fixtures/guards/ci/needs-success-crlf.json 2>&1)
          crlf_status=$?
          set -e
          printf '%s\n' "$bom"
          printf '%s\n' "$crlf"
          if [ "$bom_status" -eq 0 ]; then
            echo "bom gate fixture was accepted"
            exit 1
          fi
          printf '%s\n' "$bom" | grep -q 'needs-success.json sha256 does not match'
          if [ "$crlf_status" -eq 0 ]; then
            echo "crlf gate fixture was accepted"
            exit 1
          fi
          printf '%s\n' "$crlf" | grep -q 'needs-success.json sha256 does not match'
      - name: gate continue-on-error fails
        run: |
          set +e
          job=$(cargo xtask guards ci-gate --file fixtures/guards/ci/gate-continue-on-error.yml 2>&1)
          job_status=$?
          step=$(cargo xtask guards ci-gate --file fixtures/guards/ci/gate-step-continue-on-error.yml 2>&1)
          step_status=$?
          needed=$(cargo xtask guards ci-gate --file fixtures/guards/ci/needed-continue-on-error.yml 2>&1)
          needed_status=$?
          set -e
          printf '%s\n' "$job"
          printf '%s\n' "$step"
          printf '%s\n' "$needed"
          if [ "$job_status" -eq 0 ]; then
            echo "gate continue-on-error was accepted"
            exit 1
          fi
          printf '%s\n' "$job" | grep -q 'gate job sets continue-on-error'
          if [ "$step_status" -eq 0 ]; then
            echo "gate step continue-on-error was accepted"
            exit 1
          fi
          printf '%s\n' "$step" | grep -q 'gate step sets continue-on-error'
          if [ "$needed_status" -eq 0 ]; then
            echo "needed job continue-on-error was accepted"
            exit 1
          fi
          printf '%s\n' "$needed" | grep -q 'ci job fmt sets continue-on-error'
      - name: gate step if fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/gate-step-if.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "gate step if was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'gate step sets if:'
      - name: required job step if fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/needed-step-if.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "required job step if was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci job fmt sets step if:'
      - name: required job if fails
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/job-if.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "required job if was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci job fmt sets if:'
      - name: renamed ci job fails the ratchet
        run: |
          set +e
          output=$(cargo xtask guards ratchet --current fixtures/guards/floors-renamed-job.toml --base regressions/floors.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "renamed ci job was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci job fmt deleted'
      - name: jobs comment still sees a missing need
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/jobs-comment.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "jobs comment hid the inventory"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci job clippy is missing from gate.needs'
      - name: empty jobs map fails closed
        run: |
          set +e
          output=$(cargo xtask guards ci-gate --file fixtures/guards/ci/jobs-empty.yml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "empty jobs map was accepted"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ci workflow has no jobs'
      - name: mutated ci job bytes fail closed
        run: |
          set -euo pipefail
          copy=$(mktemp -d)
          git clone --local --quiet "$GITHUB_WORKSPACE" "$copy"
          base=$(git -C "$copy" rev-parse HEAD)
          set +e
          clean=$(cd "$copy" && PARANGSAE_FLOOR_BASE="$base" cargo xtask guards 2>&1)
          clean_status=$?
          set -e
          printf '%s\n' "$clean"
          if [ "$clean_status" -ne 0 ]; then
            echo "unmutated copy was rejected"
            exit 1
          fi
          f="$copy/unmutated-guards.txt"
          set +e
          printf '%s\n' "$clean" > "$f"
          write_rc=$?
          set -e
          if [ "$write_rc" -ne 0 ]; then
            echo "unmutated guards output was not written"
            exit "$write_rc"
          fi
          set +e
          grep -qF -- 'ci job fmt bytes do not match' "$f"
          clean_rc=$?
          set -e
          if [ "$clean_rc" -gt 1 ]; then
            echo "unmutated guards grep failed"
            exit "$clean_rc"
          fi
          if [ "$clean_rc" -eq 0 ]; then
            echo "unmutated copy reported a byte mismatch"
            exit 1
          fi
          python3 - "$copy" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          path = root / ".github/workflows/ci.yml"
          text = path.read_text()
          needle = "    name: fmt\n"
          at = text.find(needle)
          if at < 0:
              raise SystemExit("fmt job marker missing")
          byte_at = at + len("    name: fm")
          chars = list(text)
          if chars[byte_at] != "t":
              raise SystemExit("fmt name byte is not t")
          chars[byte_at] = "u"
          path.write_text("".join(chars))
          PY
          set +e
          output=$(cd "$copy" && PARANGSAE_FLOOR_BASE="$base" cargo xtask guards 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "mutated ci job was accepted"
            exit 1
          fi
          f="$copy/mutated-guards.txt"
          set +e
          printf '%s\n' "$output" > "$f"
          write_rc=$?
          set -e
          if [ "$write_rc" -ne 0 ]; then
            echo "mutated guards output was not written"
            exit "$write_rc"
          fi
          set +e
          grep -qF -- 'ci job fmt bytes do not match' "$f"
          match_rc=$?
          set -e
          if [ "$match_rc" -gt 1 ]; then
            echo "mutated guards grep failed"
            exit "$match_rc"
          fi
          if [ "$match_rc" -ne 0 ]; then
            echo "mutated copy missed the byte mismatch"
            exit 1
          fi

  tla:
    name: tla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC 2.19 (TLA+ 1.7.4)
        run: |
          cd specs/tla
          curl -fsSL -o tla2tools.jar -L \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      - name: Model-check IngestSegment
        # One worker: TLC 2.19 can miss a liveness counterexample with several workers.
        # A violated invariant or property makes TLC exit non-zero.
        run: |
          cd specs/tla
          set -o pipefail
          java -XX:+UseParallelGC -Xmx512m -cp tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-ingest" \
            -config IngestSegment.cfg \
            IngestSegment.tla | tee "${{ runner.temp }}/tlc-ingest.txt"
      - name: Check IngestSegment TLC output
        run: |
          cd "$GITHUB_WORKSPACE"
          cargo xtask guards tlc-output --model IngestSegment --file "${{ runner.temp }}/tlc-ingest.txt"
      - name: Model-check ManifestWrite
        run: |
          cd specs/tla
          set -o pipefail
          java -XX:+UseParallelGC -Xmx512m -cp tla2tools.jar tlc2.TLC \
            -workers 1 \
            -metadir "${{ runner.temp }}/tlc-manifest" \
            -config ManifestWrite.cfg \
            ManifestWrite.tla | tee "${{ runner.temp }}/tlc-manifest.txt"
      - name: Check ManifestWrite TLC output
        run: |
          cd "$GITHUB_WORKSPACE"
          cargo xtask guards tlc-output --model ManifestWrite --file "${{ runner.temp }}/tlc-manifest.txt"

  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: cargo and rustc are the 1.98.0 toolchain
        run: |
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          if [ "$cargo_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo" ]; then
            echo "cargo is ${cargo_bin}"
            exit 1
          fi
          if [ "$rustc_bin" != "/home/runner/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/rustc" ]; then
            echo "rustc is ${rustc_bin}"
            exit 1
          fi
      - name: rustc is 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
      # The marketplace action at v1.1 has a broken version check (`if [$?`).
      # Install the pinned verifier directly so a failed proof fails this job.
      - name: Install Kani 0.68.0
        env:
          # rust-toolchain.toml pins 1.98.0. The verifier builds with that pin.
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Prove notional arithmetic
        env:
          # cargo kani must use the nightly it installed, not the pinned stable.
          RUSTUP_TOOLCHAIN: nightly-2026-08-21
        run: |
          expected="rustc 1.100.0-nightly (8925ea358 2026-08-20)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
          set -o pipefail
          cargo kani -p parangsae-core 2>&1 | tee "${{ runner.temp }}/kani.txt"
      - name: Check the Kani summary
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          expected="rustc 1.98.0 (88d9e12ae 2026-08-18)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
          cargo xtask guards kani-output --file "${{ runner.temp }}/kani.txt"
      - name: removing the negative guard fails its proof
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-21
        run: |
          expected="rustc 1.100.0-nightly (8925ea358 2026-08-20)"
          actual="$(rustc -V)"
          if [ "$actual" != "$expected" ]; then
            echo "rustc -V was ${actual}"
            exit 1
          fi
          set +e
          output=$(cargo kani --manifest-path fixtures/guards/unguarded-notional/Cargo.toml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "unguarded notional proof passed"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'unguarded_notional_accepts_a_negative'

